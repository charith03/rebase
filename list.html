<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this is my page session</title>
    <style>
        /* Basic styling for better readability */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1, h2 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 150%;
            margin-top: 100px;
        }
        table, th, td {
            border: 1px solid #666;
            padding: 8px;
        }
        th {
            background-color: #ddd;
        }
        form {
            margin-top: 200px;
        }
        input, textarea, select {
            margin-bottom: 10px;
            padding: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>comes to my page</h1>
    <p>This is a simple HTML example demonstrating common elements.</p>

    <!-- Link -->
    <p>Visit <a href="https://wwwexample.com" target="_blank">Example Website</a></p>

    <!-- Image -->
    <img src="https://via.placeholder.com/150" alt="Sample Image">

    <!-- List -->
    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <!-- Table -->
    <h2>Sample Table</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>30</td>
        </tr>
    </table>

    <!-- Form -->
    <h2>Contact Form</h2>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="">Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
